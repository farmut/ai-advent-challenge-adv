# Day13 guard-proxy. Clients authenticate with "Authorization: Bearer <key>";
# keys come ONLY from env PROXY_API_KEYS (comma-separated), never from this
# file ("api_keys" here is rejected). Without keys the proxy does not start.
# There is no TLS: listen is loopback-only unless allow_non_loopback is true
# (then AUDIT_PEPPER is required and a TLS terminator must be in front).
proxy:
  listen: 127.0.0.1:8090
  max_body_bytes: 1048576
  allow_non_loopback: false

# OpenAI-compatible APIs. Keys are read only from the env variable named in
# api_key_env (never from this file). PROXY_UPSTREAM_<NAME>_BASE_URL overrides base_url.
# base_url: no userinfo/query/fragment; with api_key_env it must be https or
# loopback; a keyless upstream must be loopback unless allow_remote: true
# (then a WARN is logged: Ollama/LM Studio have no auth).
upstreams:
  mlx:
    base_url: http://127.0.0.1:18081/v1
    api_key_env: ""
    timeout: 180s
  ollama:
    base_url: http://127.0.0.1:11434/v1
    api_key_env: ""
    timeout: 180s
  lmstudio:
    base_url: http://127.0.0.1:1234/v1
    api_key_env: ""
    timeout: 180s
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout: 60s

  # OpenRouter: any cloud model by id. Key from env only (OPENROUTER_API_KEY);
  # the route is "not ready" until the key is set, other aliases are unaffected.
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    # The egress to OpenRouter can sit behind a Cloudflare strict window for
    # minutes; the test relay (scripts/or_relay.py) retries patiently, so the
    # upstream timeout must outlive that patience (proxy 503s cut it off at
    # 120s while the relay was still retrying).
    timeout: 300s

# Public model aliases (allowlist). Prices: micro-USD per 1M tokens.
# PROXY_MODEL_<ALIAS>_UPSTREAM_MODEL overrides upstream_model (alias upper-cased,
# '-' and '.' -> '_'), e.g. PROXY_MODEL_QWEN2_5_7B_OLLAMA_UPSTREAM_MODEL=gemma4:12b.
models:
  qwen2.5-7b-local:
    upstream: mlx
    upstream_model: models/baseline-qwen2.5-7b-4bit
    local_path: true
    price: { input_micro_usd_per_1m: 0, output_micro_usd_per_1m: 0, ref: local }
  qwen2.5-7b-ollama:
    upstream: ollama
    upstream_model: qwen2.5:7b-instruct
    local_path: false
    price: { input_micro_usd_per_1m: 0, output_micro_usd_per_1m: 0, ref: local }
  qwen2.5-7b-lmstudio:
    upstream: lmstudio
    upstream_model: qwen2.5-7b-instruct
    local_path: false
    price: { input_micro_usd_per_1m: 0, output_micro_usd_per_1m: 0, ref: local }
  gpt-4.1-mini:
    upstream: openai
    upstream_model: gpt-4.1-mini
    # Verify against https://openai.com/api/pricing before relying on cost figures.
    price: { input_micro_usd_per_1m: 400000, output_micro_usd_per_1m: 1600000, ref: "openai-pricing-2026-11" }

  # deepseek/deepseek-v4.1-flash-1017 via OpenRouter. Prices from the public
  # OpenRouter catalog (2026-11-10): $0.006 / $0.50 per 1M tokens.
  deepseek-flash:
    upstream: openrouter
    upstream_model: deepseek/deepseek-v4.1-flash-1017
    price: { input_micro_usd_per_1m: 6000, output_micro_usd_per_1m: 500000, ref: "openrouter-2026-11-10" }

# All limits live here (nothing is hard-coded). Fast values for tests are only
# in configs/proxy.e2e.yaml; configs/proxy.limits.yaml is for limit checks.
rate_limit:
  per_minute: 20
  window: 1m
  max_keys: 10000

# Per client IP: after max_failures 401s within window -> 429 without checking the key.
auth:
  bruteforce:
    max_failures: 10
    window: 5m

# Tool calling (tools / tool_calls / role=tool). Requests over a limit get 400 invalid_request.
tools:
  max_tools: 64
  max_definitions_bytes: 262144   # JSON size of "tools"
  max_arguments_bytes: 65536      # one tool_calls[].function.arguments

guard:
  input:
    mode: mask              # mask | block (env PROXY_GUARD_MODE)
    overrides:
      private_key: block
    max_decode_depth: 2
    scan_roles: [system, user, assistant, tool, developer]
  output:
    system_leak_ngram: 8
    url_allowlist: [github.com, docs.python.org, go.dev, wikipedia.org]
    refusal_text: "Ответ модели скрыт политикой безопасности прокси."
  # Public documentation example values (AWS docs) are never reported.
  allowlist: [AKIAIOSFODNN7EXAMPLE, wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY]

audit:
  path: logs/audit/proxy-audit.jsonl
  max_text_runes: 4000
  system_content: hash      # hash: "[SYSTEM sha=<hmac12> runes=N]" | full: masked text

log:
  level: info
