# Smoke restart (plan §6.1): constant lr 2e-5 after warmup 20, 60 steps, save every 20.
# The first lr 5e-5 run failed loss and format_ok; this is the single pre-registered fallback.
# No further smoke restart is allowed.
model: ../Day8/models/qwen2.5-7b-instruct-4bit-bf16
train: true
fine_tune_type: lora
data: data/distill               # train.jsonl / valid.jsonl, system = LIST_PROMPT
adapter_path: adapters/smoke
mask_prompt: true
seed: 42
num_layers: 16
lora_parameters: {rank: 8, scale: 20.0, dropout: 0.05,
                  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj]}
batch_size: 4
iters: 60
learning_rate: 2.0e-5
lr_schedule: {name: linear_schedule, warmup: 20, arguments: [2.0e-5, 2.0e-5, 1]}
optimizer: adam
max_seq_length: 2048
grad_checkpoint: true
steps_per_report: 5
steps_per_eval: 20
val_batches: -1
save_every: 20
