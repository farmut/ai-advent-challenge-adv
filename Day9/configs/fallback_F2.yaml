# Fallback F2 (plan §6.4, only if F1 fails): the main recipe, data rebuilt with LIST_PROMPT_GIST as system
# (distill.py build --prompt gist -> data/distill_gist), from the clean base.
model: ../Day8/models/qwen2.5-7b-instruct-4bit-bf16
train: true
fine_tune_type: lora
data: data/distill_gist
adapter_path: adapters/student_f2
mask_prompt: true
seed: 42
num_layers: 16
lora_parameters: {rank: 8, scale: 20.0, dropout: 0.05,
                  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj]}
batch_size: 4
iters: 650
learning_rate: 5.0e-5
lr_schedule: {name: linear_schedule, warmup: 40, arguments: [5.0e-5, 5.0e-5, 1]}
optimizer: adam
max_seq_length: 2048
grad_checkpoint: true
steps_per_report: 10
steps_per_eval: 50
val_batches: -1
save_every: 50
