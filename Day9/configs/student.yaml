# Main student run (plan §6.2): attention-only LoRA q/k/v/o, r8, scale 20, dropout 0.05, 16 layers,
# mask_prompt, no clipping (stock trainer), constant lr 5e-5 after warmup 40, batch 4, ~4 epochs, save every 50.
# iters = 4 * len(train) / 4; the placeholder 650 is fixed in prereg v2 from the final train size.
model: ../Day8/models/qwen2.5-7b-instruct-4bit-bf16
train: true
fine_tune_type: lora
data: data/distill
adapter_path: adapters/student
mask_prompt: true
seed: 42
num_layers: 16
lora_parameters: {rank: 8, scale: 20.0, dropout: 0.05,
                  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj]}
batch_size: 4
iters: 650
learning_rate: 5.0e-5
lr_schedule: {name: linear_schedule, warmup: 40, arguments: [5.0e-5, 5.0e-5, 1]}
optimizer: adam
max_seq_length: 2048
grad_checkpoint: true
steps_per_report: 10
steps_per_eval: 50               # pooled valid loss at every checkpoint: the tie-break of select_ckpt.py
val_batches: -1
save_every: 50
