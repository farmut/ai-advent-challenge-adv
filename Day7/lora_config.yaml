# QLoRA: LoRA adapters on top of a 4-bit quantized base model (mlx_lm.lora), recipe from Day6
model: models/qwen2.5-7b-instruct-4bit-bf16   # clean mlx-community/Qwen2.5-7B-Instruct-4bit, fp16 -> bf16 (to_bf16.py), no Day6 adapter
train: true
fine_tune_type: lora
data: data                 # train.jsonl / valid.jsonl from clean.py, system = detailed prompt (SYSTEM_PROMPTED)
adapter_path: adapters
mask_prompt: true          # loss only on assistant answers
seed: 42

num_layers: 16             # last 16 of 28 transformer blocks
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.05
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj]

batch_size: 4
iters: 200                 # ~3.2 epochs over 249 examples; checkpoint picked by label accuracy on valid (select_ckpt.py)
learning_rate: 2.0e-5      # 5e-5 diverged at step 40 with this data (train_run4_*_diverged.log); 2e-5 was stable in run 1
lr_schedule:
  name: cosine_decay
  warmup: 40
  arguments: [2.0e-5, 160, 2.0e-6]
optimizer: adam
max_seq_length: 2048       # examples are ~1600 tokens with the detailed prompt
grad_checkpoint: true      # batch 4 x 1600 tokens does not fit 36 GB otherwise

steps_per_report: 10
steps_per_eval: 50
val_batches: -1            # whole valid set
save_every: 50
