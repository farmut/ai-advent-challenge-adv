# QLoRA: LoRA adapters on top of a 4-bit quantized base model (mlx_lm.lora), recipe from Day6
model: models/qwen2.5-7b-instruct-4bit-bf16   # clean mlx-community/Qwen2.5-7B-Instruct-4bit, fp16 -> bf16 (to_bf16.py), no Day6 adapter
train: true
fine_tune_type: lora
data: data                 # train.jsonl / valid.jsonl from clean.py
adapter_path: adapters
mask_prompt: true          # loss only on assistant answers
seed: 42

num_layers: 16             # last 16 of 28 transformer blocks
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.05
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj]

batch_size: 4
iters: 400                 # ~6.4 epochs over 249 examples; best checkpoint picked by val loss
learning_rate: 5.0e-5      # run 1 with 2e-5 underfit (val 1.52, principle names not learned, results/train_run1_lr2e-5.log)
lr_schedule:
  name: cosine_decay
  warmup: 20
  arguments: [5.0e-5, 380, 5.0e-6]
optimizer: adam
max_seq_length: 1024
grad_checkpoint: false

steps_per_report: 10
steps_per_eval: 50
val_batches: -1            # whole valid set
save_every: 50
