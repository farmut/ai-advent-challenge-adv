# QLoRA: LoRA adapters on top of a 4-bit quantized base model (mlx_lm.lora)
model: models/qwen2.5-7b-instruct-4bit-bf16   # mlx-community/Qwen2.5-7B-Instruct-4bit, fp16 tensors cast to bf16 (to_bf16.py)
train: true
fine_tune_type: lora
data: data                 # SberQuAD in chat format (prepare_data.py)
adapter_path: adapters
mask_prompt: true          # loss only on assistant answers
seed: 42

num_layers: 16             # last 16 of 28 transformer blocks
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.05
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj]

batch_size: 4
iters: 750                 # 1 epoch over 3000 examples
learning_rate: 2.0e-5      # 1e-4 diverged at ~30 steps, 5e-5 at ~120 (results/train_lr*_diverged.log); LoRA scale 20 amplifies the step
lr_schedule:
  name: cosine_decay
  warmup: 50               # linear 0 -> 2e-5 over 50 steps
  arguments: [2.0e-5, 700, 2.0e-6]   # then cosine to 2e-6
optimizer: adam
max_seq_length: 1024       # longest example is 722 tokens
grad_checkpoint: false     # measured: slower, memory is not a constraint here

steps_per_report: 10
steps_per_eval: 150
val_batches: 25
save_every: 250
