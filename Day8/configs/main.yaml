# Main run (plan step 6): one long run, constant lr after warmup, eval/save every 25 steps.
# lora_parameters.keys: set after the smoke test (default = smoke_mlp; replace with smoke_attn keys/scale if unstable).
model: models/qwen2.5-7b-instruct-4bit-bf16
data: data/mix
iters: 550                 # 500 examples / batch 4 = 125 steps per epoch -> 4.4 epochs; not below 450
batch_size: 4
seed: 42
learning_rate: 2.0e-5
warmup: 30
max_grad_norm: 1.0
num_layers: 16
lora_parameters:
  rank: 8
  scale: 8.0
  dropout: 0.0
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj,
         mlp.gate_proj, mlp.up_proj, mlp.down_proj]
mask_prompt: true
max_seq_length: 2048
grad_checkpoint: true
steps_per_report: 5
eval_every: 25
save_every: 25
