# Main run (plan step 6, amended 2026-10-31 before the start, see results/prereg.json "amendments"):
# stock mlx_lm.lora with the Day7 run 4b recipe — our train.py diverged in smoke tests (with and without clipping),
# the stock trainer was stable on the same mix (results/debug/day7_recipe_mix.log).
model: models/qwen2.5-7b-instruct-4bit-bf16
train: true
fine_tune_type: lora
data: data/mix                 # train.jsonl (500) / valid.jsonl (80, union of the per-task valid sets)
adapter_path: adapters/main
mask_prompt: true
seed: 42
num_layers: 16
lora_parameters: {rank: 8, scale: 20.0, dropout: 0.05,
                  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj]}
batch_size: 4
iters: 550                     # ~4.4 epochs over 500 examples
learning_rate: 2.0e-5
lr_schedule: {name: cosine_decay, warmup: 40, arguments: [2.0e-5, 510, 2.0e-6]}
optimizer: adam
max_seq_length: 2048
grad_checkpoint: true
steps_per_report: 5
steps_per_eval: 1000           # built-in pooled val only at step 1 and the end; per-task val offline (val_ckpts.py)
val_batches: -1
save_every: 25
