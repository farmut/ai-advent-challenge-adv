# Smoke test (plan step 6): is LoRA on attention + MLP stable with clipping and a small scale?
# Stable = no NaN, no jump > 30%, loss@40 < loss@5. Otherwise use smoke_attn (Day7 run 4b recipe).
model: models/qwen2.5-7b-instruct-4bit-bf16
data: data/mix
iters: 40
batch_size: 4
seed: 42
learning_rate: 2.0e-5
warmup: 30                 # linear lr/30 .. lr over 30 updates, then constant
max_grad_norm: 1.0
num_layers: 16
lora_parameters:
  rank: 8
  scale: 8.0
  dropout: 0.0
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj,
         mlp.gate_proj, mlp.up_proj, mlp.down_proj]
mask_prompt: true
max_seq_length: 2048
grad_checkpoint: true
steps_per_report: 5
eval_every: 10
save_every: 20
