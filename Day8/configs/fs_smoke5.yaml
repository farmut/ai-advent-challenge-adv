# Extra run (user decision 2026-11-01): facts + style only, short examples; smoke to pick lr.
model: models/qwen2.5-7b-instruct-4bit-bf16
train: true
fine_tune_type: lora
data: data/fs
adapter_path: adapters/fs_smoke5
mask_prompt: true
seed: 42
num_layers: 16
lora_parameters: {rank: 8, scale: 20.0, dropout: 0.05,
                  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj]}
batch_size: 4
iters: 60
learning_rate: 5.0e-5
lr_schedule: {name: linear_schedule, arguments: [5.0e-5, 5.0e-5, 1], warmup: 20}
optimizer: adam
max_seq_length: 2048
grad_checkpoint: false
steps_per_report: 5
steps_per_eval: 20
val_batches: -1
save_every: 1000
