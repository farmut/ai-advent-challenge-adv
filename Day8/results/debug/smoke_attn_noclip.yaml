# Fallback smoke: Day7 run 4b recipe (attention only, r8, scale 20), 40 steps.
model: models/qwen2.5-7b-instruct-4bit-bf16
data: data/mix
iters: 30
batch_size: 4
seed: 42
learning_rate: 2.0e-5
warmup: 30
max_grad_norm: 1.0e+12   # debug: clipping disabled
num_layers: 16
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.0
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj]
mask_prompt: true
max_seq_length: 2048
grad_checkpoint: true
steps_per_report: 5
eval_every: 10
save_every: 20
