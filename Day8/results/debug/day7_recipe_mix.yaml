# debug: stock mlx_lm.lora, Day7 run 4b recipe (attention only, no clipping), on the Day8 mix, 40 steps
model: models/qwen2.5-7b-instruct-4bit-bf16
train: true
fine_tune_type: lora
data: data/debug_mix
adapter_path: adapters/debug_day7_recipe
mask_prompt: true
seed: 42
num_layers: 16
lora_parameters: {rank: 8, scale: 20.0, dropout: 0.05, keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj]}
batch_size: 4
iters: 40
learning_rate: 2.0e-5
lr_schedule: {name: cosine_decay, warmup: 40, arguments: [2.0e-5, 160, 2.0e-6]}
optimizer: adam
max_seq_length: 2048
grad_checkpoint: true
steps_per_report: 5
steps_per_eval: 20
val_batches: -1
save_every: 100
